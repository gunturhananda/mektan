function parseNimDelta(raw) {
  const s = String(raw || '').trim();
  if (!s) return 0;
  // Direct decimal like 0.62 or 0,62
  if (/^0[.,]\d+$/.test(s)) return parseFloat(s.replace(',', '.'));
  const digits = s.replace(/\D/g, '');
  if (!digits) return 0;
  let num = parseInt(digits.slice(-3), 10);
  if (num === 0) return 0;
  if (num >= 100) {
    // Aturan: untuk NIM 100 mulai dari 0,1 (100 -> 0.10, 101 -> 0.11, dst.)
    return Math.round((0.10 + (num - 100) * 0.01) * 1000) / 1000;
  }
  return Math.round((num / 100) * 1000) / 1000;
}

function fmt(v, dec = 2) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  return Number(v).toFixed(dec).replace('.', ',');
}

function fmtExp(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  return Number(v).toExponential(2).replace('.', ',');
}

function frac(numHtml, denHtml) {
  return `<span class="frac"><span class="num">${numHtml}</span><span class="den">${denHtml}</span></span>`;
}

function showToast(msg) {

  box.textContent = msg;

  clearTimeout(box._timer);
  box._timer = setTimeout(() => box.classList.add('hidden'), 2800);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Langkah perhitungan berhasil disalin!'))
      .catch(() => fallbackCopy(text));

}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('Langkah perhitungan berhasil disalin!'); } catch (e) {}
  document.body.removeChild(ta);
}

function linReg(xs, ys) {
  const n = xs.length;
  const mx = xs.reduce((a, b) => a + b, 0) / n;
  const my = ys.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    num += (xs[i] - mx) * (ys[i] - my);
    den += (xs[i] - mx) ** 2;
  }
  const slope = den === 0 ? 0 : num / den;
  const intercept = my - slope * mx;
  return { slope, intercept };
}

function rhoWater(T) {
  return 1 - ((T + 288.9414) / (508929.2 * (T + 68.12963))) * ((T - 3.9863) ** 2);
}

// ============================================================================
// 3. CALCULATION ENGINE (ALL 13 TESTS, PURE FUNCTION OF delta & options)
// ============================================================================
function computeAll(delta, opts = { cbrAddLoadDelta: true }) {
  const d = Number(delta) || 0;

  // 1. SONDIR (PK & JP + d)
  let jhlCum = 0;
  let sumPK = 0, sumJHL = 0, sumHS = 0;
  const sondirRows = BASE.sondir.map(([mt, pk0, jp0]) => {
    const pk = pk0 + d;
    const jp = jp0 + d;
    const hl = jp - pk;
    const hlKor = hl * 20 / 10;
    jhlCum += hlKor;
    const hs = hl / 10;
    sumPK += pk;
    sumJHL += jhlCum;
    sumHS += hs;
    return { mt, pk, jp, hl, hlKor, jhl: jhlCum, hs };
  });
  const sondir = {
    rows: sondirRows,
    n: sondirRows.length,
    sumPK,
    sumJHL,
    qcAvg: sumPK / sondirRows.length,
    qfAvg: sumJHL / sondirRows.length,
    jhlMax: jhlCum,
    pkMax: Math.max(...sondirRows.map(r => r.pk)),
    frAvg: (sumHS / sondirRows.length) / (sumPK / sondirRows.length) * 100
  };

  // 2. SAND CONE (tidak ditambah NIM)
  const sc = BASE.sandCone;
  const scVolTabung = sc.w3 - sc.w1;
  const scBeratPasir = sc.w2 - sc.w1;
  const scYsand = scBeratPasir / scVolTabung;
  const scA = sc.w6 - sc.w7;
  const scB = sc.w11 - sc.w10;
  const scC = (sc.w13 - sc.w14) / (sc.w14 - sc.w12); // decimal
  const scD = scB / (1 + scC);
  const scE = sc.w8 - sc.w9;
  const scF = scE - scA;
  const scG = scF / scYsand;
  const scH = scD / scG;
  const scI = (scH / sc.gdLab) * 100;
  const sandCone = { ...sc, volTabung: scVolTabung, beratPasir: scBeratPasir, ysand: scYsand, A: scA, B: scB, C: scC * 100, Cdec: scC, D: scD, E: scE, F: scF, G: scG, H: scH, I: scI };

  // 3. KADAR AIR (W1 & W2 + d)
  const calcKA = (arr) => {
    const rows = arr.map(r => {
      const w1 = r.w1 + d, w2 = r.w2 + d, w3 = r.w3;
      const wAir = w1 - w2;
      const wKering = w2 - w3;
      const w = (wAir / wKering) * 100;
      return { no: r.no, w1, w2, w3, wAir, wKering, w };
    });
    const avg = rows.reduce((s, r) => s + r.w, 0) / rows.length;
    return { rows, avg };
  };
  const kadarAir = { tt: calcKA(BASE.kadarAir.tt), tg: calcKA(BASE.kadarAir.tg) };

  // 4. BERAT SPESIFIK (W2 & W3 + d)
  const calcGs = (p) => {
    const w1 = p.w1, w2 = p.w2 + d, w3 = p.w3 + d, w4 = p.w4;
    const wTanah = w2 - w1;
    const wAir = (w4 - w1) - (w3 - w2);
    const rhoT = rhoWater(p.T);
    const gsT = wTanah / wAir;
    const gs275 = gsT * rhoT / 0.9964;
    return { ...p, w1, w2, w3, w4, wTanah, wAir, rhoT, gsT, gs275 };
  };
  const gsA = calcGs(BASE.beratSpesifik.a);
  const gsB = calcGs(BASE.beratSpesifik.b);
  const beratSpesifik = { a: gsA, b: gsB, avg: (gsA.gs275 + gsB.gs275) / 2, avgRaw: (gsA.gsT + gsB.gsT) / 2 };

  // 5. ATTERBERG (W1 & W2 + d)
  const llRows = BASE.atterberg.ll.map(r => {
    const w1 = r.w1 + d, w2 = r.w2 + d, w3 = r.w3;
    const wAir = w1 - w2, wKering = w2 - w3, w = (wAir / wKering) * 100;
    return { no: r.no, N: r.N, w1, w2, w3, wAir, wKering, w, logN: Math.log10(r.N) };
  });
  const llReg = linReg(llRows.map(r => r.logN), llRows.map(r => r.w));
  const LL = llReg.intercept + llReg.slope * Math.log10(25);
  const plRows = BASE.atterberg.pl.map(r => {
    const w1 = r.w1 + d, w2 = r.w2 + d, w3 = r.w3;
    const wAir = w1 - w2, wKering = w2 - w3, w = (wAir / wKering) * 100;
    return { no: r.no, w1, w2, w3, wAir, wKering, w };
  });
  const PL = (plRows[0].w + plRows[1].w) / 2;
  const PI = LL - PL;
  const atterberg = { llRows, plRows, llReg, LL, PL, PI };

  // 6. ANALISIS SARINGAN / ANSAR (Berat tertahan + d pada saringan aktif)
  const ansarRaw = BASE.ansar.sieves.map(s => ({ ...s, w: s.addNim ? s.w + d : s.w }));
  const ansarTotal = ansarRaw.reduce((s, r) => s + r.w, 0);
  let ansarCum = 0;
  const ansarRows = ansarRaw.map(r => {
    ansarCum += r.w;
    const pctTertahan = (ansarCum / ansarTotal) * 100;
    const pctLolos = 100 - pctTertahan;
    return { ...r, cumW: ansarCum, pctTertahan, pctLolos };
  });
  const lolos200Ansar = ansarRows.find(r => r.nama === 'No. 200').pctLolos;
  // Interpolate D30, D60 from Ansar (D10 < 0.075 mm so comes from combined Hydrometer)
  const interpD = (pts, targetP) => {
    // pts sorted descending by mm: [{mm, p}]
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      if ((a.p >= targetP && b.p <= targetP) || (a.p <= targetP && b.p >= targetP)) {
        if (a.p === b.p) return a.mm;
        const t = (targetP - b.p) / (a.p - b.p);
        return Math.pow(10, Math.log10(b.mm) + t * (Math.log10(a.mm) - Math.log10(b.mm)));
      }
    }
    return null;
  };
  const ansarPts = ansarRows.filter(r => r.mm > 0 && r.mm <= 4.75).map(r => ({ mm: r.mm, p: r.pctLolos }));
  const ansar = {
    rows: ansarRows,
    totalW: ansarTotal,
    lolos200: lolos200Ansar,
    d30: interpD(ansarPts, 30),
    d60: interpD(ansarPts, 60)
  };

  // 7. HIDROMETER (Berat tertahan + d & Rh + d; k = -0.50 sesuai PDF hal. 23-25!)
  const gsHydro = d === 0 ? 2.678 : beratSpesifik.avg;
  const hydroK = 0.01258 + ((gsHydro - 2.65) / (2.70 - 2.65)) * (0.01239 - 0.01258);
  const hydroC = 1.0 + ((gsHydro - 2.65) / (2.70 - 2.65)) * (0.99 - 1.0);
  let hSieveCum = 0;
  const hydroSieves = BASE.hidrometer.sieves.map(s => {
    const w = s.w + d;
    hSieveCum += w;
    const pctT = (hSieveCum / BASE.hidrometer.ws) * 100;
    const pctL = 100 - pctT;
    return { ...s, w, cumW: hSieveCum, pctT, pctL };
  });
  const hydroReadings = BASE.hidrometer.readings.map(r => {
    const rh = r.rh + d;
    const L = 16.3 - 0.16 * rh; // cm (exact match PDF p.23: 7.5->15.100, 5.0->15.500)
    const sqrtLt = Math.sqrt(L / r.t);
    const Dmm = hydroK * sqrtLt;
    const kSuhu = BASE.hidrometer.kSuhu; // -0.50
    const rhK = rh + kSuhu;
    const N = (rhK * hydroC / BASE.hidrometer.ws) * 100;
    const Np = (N / 100) * lolos200Ansar;
    return { t: r.t, rh, T: BASE.hidrometer.T, L, K: hydroK, sqrtLt, Dmm, kSuhu, rhK, N, Np };
  });
  // Combined gradation curve for D10, D30, D60
  const combinedPts = [
    ...ansarPts,
    ...hydroReadings.map(r => ({ mm: r.Dmm, p: r.Np }))
  ].sort((a, b) => b.mm - a.mm);
  const d10Comb = interpD(combinedPts, 10);
  const d30Comb = interpD(combinedPts, 30);
  const d60Comb = interpD(combinedPts, 60);
  const hidrometer = {
    ws: BASE.hidrometer.ws, T: BASE.hidrometer.T, kSuhu: BASE.hidrometer.kSuhu,
    gs: gsHydro, K: hydroK, c: hydroC, lolos200: lolos200Ansar,
    sieves: hydroSieves, readings: hydroReadings,
    combinedPts, d10: d10Comb, d30: d30Comb, d60: d60Comb,
    cu: (d10Comb && d60Comb) ? d60Comb / d10Comb : null,
    cc: (d10Comb && d30Comb && d60Comb) ? (d30Comb ** 2) / (d10Comb * d60Comb) : null
  };

  // 8. PEMADATAN (basah+cawan & kering+cawan + d)
  const gsComp = beratSpesifik.avg;
  const compRows = BASE.pemadatan.titik.map(t => {
    const basahCawan = t.basahCawan + d;
    const keringCawan = t.keringCawan + d;
    const air = basahCawan - keringCawan;
    const tanahKering = keringCawan - t.cawan;
    const w = (air / tanahKering) * 100;
    const tanahBasah = t.tanahCetakan - BASE.pemadatan.massaCetakan;
    const gamma = tanahBasah / BASE.pemadatan.isiCetakan;
    const gammaD = (gamma * 100) / (100 + w);
    const zav = gsComp / (1 + (w / 100) * gsComp);
    return { ...t, basahCawan, keringCawan, air, tanahKering, w, tanahBasah, gamma, gammaD, zav };
  });
  let maxIdx = 0;
  compRows.forEach((r, i) => { if (r.gammaD > compRows[maxIdx].gammaD) maxIdx = i; });
  // Parabola peak using 3 points around maxIdx
  let wOptPara = compRows[maxIdx].w, gdMaxPara = compRows[maxIdx].gammaD;
  if (maxIdx > 0 && maxIdx < compRows.length - 1) {
    const x1 = compRows[maxIdx - 1].w, y1 = compRows[maxIdx - 1].gammaD;
    const x2 = compRows[maxIdx].w, y2 = compRows[maxIdx].gammaD;
    const x3 = compRows[maxIdx + 1].w, y3 = compRows[maxIdx + 1].gammaD;
    const denom = (x1 - x2) * (x1 - x3) * (x2 - x3);
    if (Math.abs(denom) > 1e-9) {
      const A = (x3 * (y2 - y1) + x2 * (y1 - y3) + x1 * (y3 - y2)) / denom;
      const B = (x3 * x3 * (y1 - y2) + x2 * x2 * (y3 - y1) + x1 * x1 * (y2 - y3)) / denom;
      const C = (x2 * x3 * (x2 - x3) * y1 + x3 * x1 * (x3 - x1) * y2 + x1 * x2 * (x1 - x2) * y3) / denom;
      if (A < 0) {
        wOptPara = -B / (2 * A);
        gdMaxPara = C - (B * B) / (4 * A);
      }
    }
  }
  const pemadatan = {
    gs: gsComp, massaCetakan: BASE.pemadatan.massaCetakan, isiCetakan: BASE.pemadatan.isiCetakan,
    rows: compRows, maxIdx, wOpt: compRows[maxIdx].w, gdMax: compRows[maxIdx].gammaD,
    wOptPara, gdMaxPara
  };

  // 9. CBR (beban + d if enabled, tanah+cetakan + d, basah+cawan + d, kering+cawan + d)
  const cbrSets = BASE.cbr.sets.map(s => {
    const tcSeb = s.tanahCetakanSeb + d;
    const tcSes = s.tanahCetakanSes + d;
    const tbSeb = tcSeb - BASE.cbr.cetakanBerat;
    const tbSes = tcSes - BASE.cbr.cetakanBerat;
    const gbSeb = tbSeb / BASE.cbr.isiCetakan;
    const gbSes = tbSes / BASE.cbr.isiCetakan;

    const kaSebB = s.kaSeb.basah + d, kaSebK = s.kaSeb.kering + d, kaSebC = s.kaSeb.cawan;
    const airSeb = kaSebB - kaSebK, tkSeb = kaSebK - kaSebC, wSeb = (airSeb / tkSeb) * 100;
    const kaSesB = s.kaSes.basah + d, kaSesK = s.kaSes.kering + d, kaSesC = s.kaSes.cawan;
    const airSes = kaSesB - kaSesK, tkSes = kaSesK - kaSesC, wSes = (airSes / tkSes) * 100;

    const gdSeb = gbSeb / (1 + wSeb / 100);
    const gdSes = gbSes / (1 + wSes / 100);

    const beban = s.beban.map((b) => b + (opts.cbrAddLoadDelta ? d : 0));
    const p254 = beban[5]; // index 5 is 2.54 mm
    const p508 = beban[9]; // index 9 is 5.08 mm
    const cbr254 = (p254 / 13.35) * 100;
    const cbr508 = (p508 / 20.02) * 100;
    return {
      id: s.id, label: s.label,
      tcSeb, tcSes, tbSeb, tbSes, gbSeb, gbSes, gdSeb, gdSes,
      kaSeb: { basah: kaSebB, kering: kaSebK, cawan: kaSebC, air: airSeb, tk: tkSeb, w: wSeb },
      kaSes: { basah: kaSesB, kering: kaSesK, cawan: kaSesC, air: airSes, tk: tkSes, w: wSes },
      beban, p254, p508, cbr254, cbr508, cbrMax: Math.max(cbr254, cbr508)
    };
  });
  const cbr = { waktu: BASE.cbr.waktu, penurunan: BASE.cbr.penurunan, cetakanBerat: BASE.cbr.cetakanBerat, isiCetakan: BASE.cbr.isiCetakan, sets: cbrSets };

  // 10. KONSOLIDASI R1 (semua pembacaan arloji > 0 ditambah + d)
  const K = BASE.konsolidasi;
  const kA = Math.PI / 4 * K.D * K.D;
  const kV = kA * K.ho;
  const kWb = K.w4 - K.wc;
  const kKaSeb = K.kaSeb.map(c => ({ ...c, w: (c.basah - c.kering) / c.tanahKering * 100 }));
  const kKaSes = K.kaSes.map(c => ({ ...c, w: (c.basah - c.kering) / c.tanahKering * 100 }));
  const kw0 = (kKaSeb[0].w + kKaSeb[1].w) / 2;
  const kwSes = (kKaSes[0].w + kKaSes[1].w) / 2;
  const kWk = kWb / (1 + kw0 / 100);
  const kGd = kWk / kV;
  const kHs = kWk / (K.gs * kA);
  const ke0 = (K.ho - kHs) / kHs;
  const kS = (kw0 * K.gs) / ke0;

  // Dial table with +d on all readings except (row 0, col 0) = 0.0
  const kArloji = K.arloji.map((row, rIdx) =>
    row.map((val, cIdx) => (rIdx === 0 && cIdx === 0 ? 0.0 : val + d))
  );
  const kTekanan = K.bebanKg.map(b => b * K.rasioLengan / kA);

  // Taylor sqrt(t) analysis for stages 0, 1, 2 (loading)
  const kTaylor = [0, 1, 2].map(st => {
    const [iStart, iEnd] = K.taylorFitIdx[st];
    const sqt = K.waktuMenit.map(t => Math.sqrt(t));
    const Rs = kArloji.map(row => row[st]);
    const fitX = [], fitY = [];
    for (let i = iStart; i <= iEnd; i++) { fitX.push(sqt[i]); fitY.push(Rs[i]); }
    const { slope: m, intercept: ds } = linReg(fitX, fitY);
    const line1 = sqt.map(x => ds + m * x);
    const line115 = sqt.map(x => ds + (m / 1.15) * x);
    const diff = Rs.map((r, i) => r - line115[i]);
    let crossIdx = -1;
    for (let i = iEnd + 1; i < Rs.length; i++) {
      if (diff[i] < 0) { crossIdx = i; break; }
    }
    let sqrtT90 = null, t90 = null, d90 = null;
    if (crossIdx > 0) {
      const x1 = sqt[crossIdx - 1], x2 = sqt[crossIdx];
      const f1 = diff[crossIdx - 1], f2 = diff[crossIdx];
      sqrtT90 = x2 - f2 * (x2 - x1) / (f2 - f1);
      t90 = sqrtT90 * sqrtT90;
      d90 = ds + (m / 1.15) * sqrtT90;
    }
    return { stage: st + 1, bebanKg: K.bebanKg[st], tekanan: kTekanan[st], sqt, Rs, line1, line115, m, ds, sqrtT90, t90, d90 };
  });

  // Hasil per tahap (0 + 5 stages)
  const kStages = [];
  let prevB = 0, prevH = K.ho, prevE = ke0, prevP = 0;
  kStages.push({ p: 0, bCm: 0, dh: null, de: null, e: ke0, cc: null, h: K.ho, dAvg: null, sqrtT90: null, t90Min: null, t90Sec: null, cv: null });
  for (let st = 0; st < 5; st++) {
    const p = kTekanan[st];
    const bCm = kArloji[15][st] * K.skalaArloji / 10; // 24 jam reading in cm
    const dh = bCm - prevB;
    const de = dh / kHs;
    const e = prevE - de;
    const h = prevH - dh;
    const dAvg = (prevH + h) / 2;
    const cc = (prevP > 0 && p > prevP) ? de / Math.log10(p / prevP) : null;
    let sqrtT90 = null, t90Min = null, t90Sec = null, cv = null;
    if (st < 3 && kTaylor[st].sqrtT90 !== null) {
      sqrtT90 = kTaylor[st].sqrtT90;
      t90Min = kTaylor[st].t90;
      t90Sec = t90Min * 60;
      cv = 0.848 * ((dAvg / 2) ** 2) / t90Sec;
    }
    kStages.push({ p, bCm, dh, de, e, cc, h, dAvg, sqrtT90, t90Min, t90Sec, cv });
    prevB = bCm; prevH = h; prevE = e; prevP = p;
  }
  const konsolidasi = {
    ...K, A: kA, V: kV, Wb: kWb, Wk: kWk, gd: kGd, Hs: kHs, e0: ke0, S: kS,
    kaSeb: kKaSeb, kaSes: kKaSes, w0: kw0, wSes: kwSes,
    tekanan: kTekanan, arloji: kArloji, taylor: kTaylor, stages: kStages
  };

  // 11. UCS (Pembacaan arloji beban + d untuk t > 0)
  const uA0 = Math.PI / 4 * BASE.ucs.D * BASE.ucs.D;
  const uV0 = uA0 * BASE.ucs.H;
  const uBeratIsi = BASE.ucs.berat / uV0;
  const ucsRows = BASE.ucs.rows.map((r, idx) => {
    const eps = (r.regDiv * BASE.ucs.skalaDef / 10) / BASE.ucs.H;
    const loadDiv = r.loadDiv === null ? null : (idx === 0 ? 0.0 : r.loadDiv + d);
    const loadKg = loadDiv === null ? null : loadDiv * BASE.ucs.cal * 1000 / 9.80665;
    const koreksi = 1 - eps;
    const aKor = uA0 / koreksi;
    const teg = loadKg === null ? null : loadKg / aKor;
    return { t: r.t, regDiv: r.regDiv, eps, loadDiv, cal: BASE.ucs.cal, loadKg, koreksi, aKor, teg };
  });
  const uValid = ucsRows.filter(r => r.teg !== null);
  const qu = Math.max(...uValid.map(r => r.teg));
  const cu = qu / 2;
  const ucs = { ...BASE.ucs, A0: uA0, V0: uV0, beratIsi: uBeratIsi, rows: ucsRows, qu, cu, quKpa: qu * 98.0665 };

  // 12. DIRECT SHEAR (semua Dial Reading + d)
  const dsSigma = BASE.directShear.pNormal.map(p => p / BASE.directShear.luas);
  const dsRows = BASE.directShear.dial.map(row =>
    row.map(v => {
      if (v === null) return null;
      const dial = v + d;
      const P = dial * BASE.directShear.cal;
      const tau = P / BASE.directShear.luas;
      return { dial, P, tau };
    })
  );
  const dsTauMax = [0, 1, 2].map(col => Math.max(...dsRows.map(r => r[col] ? r[col].tau : -Infinity)));
  const dsReg = linReg(dsSigma, dsTauMax);
  const dsC = dsReg.intercept;
  const dsPhi = Math.atan(dsReg.slope) * (180 / Math.PI);
  const directShear = { ...BASE.directShear, sigma: dsSigma, rows: dsRows, tauMax: dsTauMax, c: dsC, phi: dsPhi };

  // 13. PERMEABILITAS (Volume air + d; PDF h=70 cm, pi=3.14)
  const pA = 0.25 * 3.14 * (BASE.permeabilitas.D ** 2); // 31.6532 cm² (exact PDF p.46!)
  const pTrials = BASE.permeabilitas.V.map((v0, i) => {
    const V = v0 + d;
    const Q = V / BASE.permeabilitas.t;
    const k = (Q * BASE.permeabilitas.L) / (pA * BASE.permeabilitas.h);
    return { no: i + 1, V, Q, k };
  });
  const pKavg = pTrials.reduce((s, r) => s + r.k, 0) / pTrials.length;
  const permeabilitas = { ...BASE.permeabilitas, A: pA, trials: pTrials, kAvg: pKavg };

  return {
    delta: d, sondir, sandCone, kadarAir, beratSpesifik, atterberg,
    ansar, hidrometer, pemadatan, cbr, konsolidasi, ucs, directShear, permeabilitas
  };
}

  cbr: 'California Bearing Ratio', konsolidasi: 'Consolidation Test',
  ucs: 'Unconfined Compressive Strength Test', directshear: 'Direct Shear', permeabilitas: 'Permeability Test'
};
function calcHead(num, title, mukadimah) {
  return `
    <div class="calc-head"><span class="calc-head-num">${num}</span><span>${title}</span></div>
    <p class="calc-mukadimah">${mukadimah}</p>
  `;
}
function eqPairs(pairs) {
  return `<div class="eq-align">${pairs.map(([l, r]) => `<span class="eq-lhs">${l}</span><span class="eq-op">=</span><span class="eq-rhs">${r}</span>`).join('')}</div>`;
}
function eqPairs3(rows) {
  return `<div class="eq-pairs-3">${rows.map(([l, v, tag]) => `<span>${l}</span><span>=</span><span>${v}</span><span class="pl-3">${tag}</span>`).join('')}</div>`;
}
function eqLines(lhs, rhsList) {
  return `<div class="eq-align">${rhsList.map((r, i) => `<span class="eq-lhs">${i === 0 ? lhs : ''}</span><span class="eq-op">=</span><span class="eq-rhs">${r}</span>`).join('')}</div>`;
}

                  ${eqPairs([['Berat tertahan', `${fmt(r.w, 2)} gram`]])}
                  ${eqLines('Jumlah berat tertahan', [`${fmt(pC, 2)} + ${fmt(r.w, 2)}`, `<b>${fmt(r.cumW, 2)} gram</b>`])}
                  <div class="calc-step">${eqLines('a. Persentase tertahan', [`${frac('Jumlah berat tertahan','total berat')} × 100%`, `${frac(fmt(r.cumW, 2), fmt(R.ansar.totalW, 2))} × 100%`, `<b>${fmt(r.pctTertahan, 2)}%</b>`])}</div>
                  ${r.nama !== 'PAN' ? `<div class="calc-step">${eqLines('b. Persentase lolos', ['100% − Persentase tertahan', `100% − ${fmt(r.pctTertahan, 2)}%`, `<b>${fmt(r.pctLolos, 2)}%</b>`])}</div>` : ''}
                </div>
              </div>`;
          }).join('')}
          <div class="calc-sec">
            <div class="font-bold">6) Keterangan Nilai D₁₀, Cu, dan Cc pada Analisis Saringan</div>
            <div class="calc-indent1">
              <div>Persentase lolos saringan No. 200 = <b>${fmt(R.ansar.lolos200, 2)}%</b> (&gt; 10%).</div>
              <div>Karena persentase lolos saringan terkecil (No. 200) masih lebih besar dari 10%, maka nilai <b>D₁₀ tidak dapat diperoleh</b> dari pengujian analisis saringan saja, sehingga nilai <b>Cu dan Cc tidak dapat dihitung</b> pada analisis saringan ini.</div>
            </div>
          </div>
        </div>
      `);
    }

    case 'hidrometer': {
      const h = R.hidrometer;
      const r0 = h.readings[0];
      const x1L = Math.floor(r0.rh);
      const x2L = x1L + 1;
      const y1L = 163 - 1.6 * x1L;
      const y2L = 163 - 1.6 * x2L;
      return wrap(`
        ${calcHead('5.', 'Pengolahan Data', 'Berikut merupakan data perhitungan uji analisis hidrometer:')}
        <div class="calc-indent1">
          ${eqPairs([
            ['Rh', `${fmt(r0.rh, 2)}`],
            ['Massa tanah', '100 gr'],
            ['Berat jenis (Gs)', `${fmt(h.gs, 3)}`],
            ['Suhu', '27°C'],
            ['% lolos saringan No. 200', `${fmt(h.lolos200, 2)}%`]
          ])}
        </div>
        <div class="calc-sec font-bold">Maka :</div>
        <div class="calc-step font-bold">a) Nilai L (mm)</div>
        <div class="calc-indent1">
          <div>Interpolasi: x = ${fmt(r0.rh, 2)}, x₁ = ${x1L}, x₂ = ${x2L}, y₁ = ${fmt(y1L, 1)}, y₂ = ${fmt(y2L, 1)}</div>
          ${eqLines(frac('x − x₁','x₂ − x₁'), [frac('y − y₁','y₂ − y₁')])}
          ${eqLines('L', [`16,3 − 0,16 × ${fmt(r0.rh, 2)}`, `<b>${fmt(r0.L, 3)} cm</b> (${fmt(r0.L * 10, 1)} mm)`])}
        </div>
        <div class="calc-step font-bold">b) Nilai K (T = 27°C, Gs = ${fmt(h.gs, 3)})</div>
        <div class="calc-indent1">${eqLines('K', ['Interpolasi tabel K pada T = 27°C', `<b>${fmt(r0.K, 6)}</b>`])}</div>
        <div class="calc-step font-bold">c) Mencari nilai (L/t)<sup>½</sup></div>
        <div class="calc-indent1">${eqLines('(L/t)<sup>½</sup>', [`(${frac(fmt(r0.L, 3), fmt(r0.t, 1))})<sup>½</sup>`, `<b>${fmt(r0.sqrtLt, 3)}</b>`])}</div>
        <div class="calc-step font-bold">d) Nilai diameter (D)</div>
        <div class="calc-indent1">${eqLines('D', ['K × √(L/t)', `${fmt(r0.K, 6)} × ${fmt(r0.sqrtLt, 3)}`, `<b>${fmt(r0.Dmm, 4)} mm</b>`])}</div>
        <div class="calc-step font-bold">e) Koreksi suhu (k)</div>
        <div class="calc-indent1">${eqPairs([['T', '27°C'], ['k', '<b>−0,50</b>']])}</div>
        <div class="calc-step font-bold">f) Nilai Rh + k</div>
        <div class="calc-indent1">${eqLines('Rh + k', [`${fmt(r0.rh, 2)} + (−0,50)`, `<b>${fmt(r0.rhK, 2)}</b>`])}</div>
        <div class="calc-step font-bold">g) Nilai N (Interpolasi c = ${fmt(h.c, 4)})</div>
        <div class="calc-indent1">${eqLines('N', [`${frac('(Rh + k) × c','Ws')} × 100%`, `${frac(`${fmt(r0.rhK, 2)} × ${fmt(h.c, 4)}`,'100')} × 100%`, `<b>${fmt(r0.N, 3)}%</b>`])}</div>
        <div class="calc-step font-bold">h) Nilai N'</div>
        <div class="calc-indent1">${eqLines("N'", [`${frac('N','100')} × % lolos saringan No. 200`, `${frac(fmt(r0.N, 3),'100')} × ${fmt(h.lolos200, 2)}%`, `<b>${fmt(r0.Np, 3)}%</b>`])}</div>
      `);
    }

    case 'pemadatan': {
      const r = R.pemadatan.rows[0];
      return wrap(`
        ${calcHead('3.5.5', 'Pengolahan Data', 'Beberapa contoh perhitungan yang dilakukan pada uji pemadatan:')}
        <div class="font-bold">1) Penambahan air : 100 cc</div>
        <div class="calc-indent1">
          ${eqPairs([
            ['Berat tanah basah + cetakan (W₁)', `${fmt(r.tanahCetakan, 1)} gram`],
            ['Berat cetakan (W₂)', `${fmt(R.pemadatan.massaCetakan, 1)} gram`]
          ])}
          ${eqLines('Berat tanah basah (W₃)', ['W₁ − W₂', `${fmt(r.tanahCetakan, 1)} − ${fmt(R.pemadatan.massaCetakan, 1)}`, `<b>${fmt(r.tanahBasah, 1)} gram</b>`])}
          ${eqPairs([['Isi cetakan (V)', `${fmt(R.pemadatan.isiCetakan, 1)} cm³`]])}

          <div class="calc-sec font-bold">a. Mencari Kadar air (w)</div>
          <div class="calc-indent1">
            ${eqPairs([
              ['Massa tanah basah + cawan (W₁)', `${fmt(r.basahCawan, 2)} gram`],
              ['Massa tanah kering + cawan (W₂)', `${fmt(r.keringCawan, 2)} gram`],
              ['Massa cawan (W₃)', `${fmt(r.cawan, 1)} gram`]
            ])}
            <div class="calc-step">${eqLines('Berat air (W₄)', ['W₁ − W₂', `${fmt(r.basahCawan, 2)} − ${fmt(r.keringCawan, 2)}`, `<b>${fmt(r.wAir !== undefined ? r.wAir : r.air, 2)} gram</b>`])}</div>
            <div class="calc-step">${eqLines('Massa tanah kering (W₅)', ['W₂ − W₃', `${fmt(r.keringCawan, 2)} − ${fmt(r.cawan, 1)}`, `<b>${fmt(r.tanahKering, 2)} gram</b>`])}</div>
            <div class="calc-step">${eqLines('Kadar air (w)', [`${frac('W₄','W₅')} × 100%`, `${frac(fmt(r.wAir !== undefined ? r.wAir : r.air, 2), fmt(r.tanahKering, 2))} × 100%`, `<b>${fmt(r.w, 2)}%</b>`])}</div>
          </div>

          <div class="calc-sec font-bold">b. Kepadatan basah (γ)</div>
          <div class="calc-indent1">${eqLines('γ', [frac('Massa tanah basah (W₃)','Volume cetakan (V)'), frac(fmt(r.tanahBasah, 1), fmt(R.pemadatan.isiCetakan, 1)), `<b>${fmt(r.gamma, 3)} gr/cm³</b>`])}</div>

          <div class="calc-sec font-bold">c. Kepadatan kering (γdry)</div>
          <div class="calc-indent1">${eqLines('γdry', [frac('γ × 100','100 + w'), frac(`${fmt(r.gamma, 3)} × 100`, `100 + ${fmt(r.w, 2)}`), `<b>${fmt(r.gammaD, 3)} gr/cm³</b>`])}</div>

          <div class="calc-sec font-bold">d. Menghitung Zero Air Void (ZAV)</div>
          <div class="calc-indent1">
            ${eqPairs([
              ['Berat jenis (Gs)', `${fmt(R.pemadatan.gs, 3)}`],
              ['Berat volume air (γw)', '1 gr/cm³'],
              ['Kadar air (w)', `${fmt(r.w, 2)}%`]
            ])}
            <div class="calc-step">${eqLines('ZAV', [frac('Gs × 1', '1 + (w/100) × Gs'), frac(`${fmt(R.pemadatan.gs, 3)} × 1`, `1 + (${fmt(r.w, 2)}/100) × ${fmt(R.pemadatan.gs, 3)}`), `<b>${fmt(r.zav, 3)} gr/cm³</b>`])}</div>
          </div>
        </div>
      `);
    }

    case 'cbr': {
      const renderSet = (s, idx) => `
        <div class="calc-sec">
          <div class="font-bold">${idx * 2 + 1}. Untuk pukulan ${s.label.replace(/\s*Pukulan/i, '')}</div>
          <div class="calc-indent1">
            ${eqPairs([
              ['Berat tanah basah + cawan (W₁)', `${fmt(s.kaSeb.basah, 2)} gram`],
              ['Berat tanah kering + cawan (W₂)', `${fmt(s.kaSeb.kering, 2)} gram`],
              ['Berat cawan (W₃)', `${fmt(s.kaSeb.cawan, 1)} gram`],
              ['Berat air (W₄)', `${fmt(s.kaSeb.air, 2)} gram`]
            ])}
            <div class="calc-step">${eqLines('Berat tanah kering (W₅)', ['W₂ − W₃', `${fmt(s.kaSeb.kering, 2)} − ${fmt(s.kaSeb.cawan, 1)}`, `<b>${fmt(s.kaSeb.tk, 2)} gram</b>`])}</div>
            <div class="calc-step">${eqLines('Kadar Air (w)', [`${frac('W₄','W₅')} × 100%`, `${frac(fmt(s.kaSeb.air, 2), fmt(s.kaSeb.tk, 2))} × 100%`, `<b>${fmt(s.kaSeb.w, 2)}%</b>`])}</div>
          </div>
          <div class="calc-step font-bold">${idx * 2 + 2}. Harga CBR (${s.label})</div>
          <div class="calc-indent1">
            <div>a. Pada 2,54 mm</div>
            <div class="calc-indent1">${eqLines(`${frac('Beban','13,35')} × 100%`, [`${frac(fmt(s.beban[5], 3),'13,35')} × 100%`, `<b>${fmt(s.cbr254, 3)}%</b>`])}</div>
            <div class="calc-step">b. Pada 5,08 mm</div>
            <div class="calc-indent1">${eqLines(`${frac('Beban','20,02')} × 100%`, [`${frac(fmt(s.beban[9], 3),'20,02')} × 100%`, `<b>${fmt(s.cbr508, 3)}%</b>`])}</div>
          </div>
        </div>`;
      return wrap(`
        ${calcHead('3.6.5', 'Pengolahan Data', 'Berikut merupakan contoh perhitungan yang digunakan dalam pengolahan data uji CBR:')}
        ${R.cbr.sets.map((s, i) => renderSet(s, i)).join('')}
      `);
    }

    case 'konsolidasi': {
      const k = R.konsolidasi;
      const st2 = k.stages[2];
      return wrap(`
        ${calcHead('3.7.5', 'Pengolahan Data', 'Data Pengujian Konsolidasi Pada Praktikum Mekanika Tanah sebagai berikut:')}
        <div class="calc-indent1">
          ${eqPairs([
            ['Berat spesifik tanah (Gs)', `${fmt(k.gs, 3)}`],
            ['Berat cincin (Wc)', `${fmt(k.wc, 1)} gram`],
            ['Diameter cincin (D)', `${fmt(k.D, 2)} cm`],
            ['Tinggi cincin (Ho)', `${fmt(k.ho, 2)} cm`],
            ['Luas cincin (A)', `${fmt(k.A, 3)} cm²`],
            ['Volume cincin (V)', `${fmt(k.V, 3)} cm³`]
          ])}
        </div>
        <div class="calc-sec font-bold">1. Menghitung angka pori dan derajat kejenuhan</div>
        <div class="calc-indent1">
          ${eqPairs([
            ['Berat cincin + tanah basah (W₄)', `${fmt(k.w4, 1)} gram`],
            ['Berat tanah basah (Wb)', `${fmt(k.Wb, 1)} gram`],
            ['Berat tanah kering (Wk)', `${fmt(k.Wk, 2)} gram`]
          ])}
          <div class="calc-step">${eqLines('Berat volume kering (γd)', [frac('Wk','V'), frac(fmt(k.Wk, 2), fmt(k.V, 2)), `<b>${fmt(k.gd, 3)} gram/cm³</b>`])}</div>
          <div class="calc-step">${eqLines('Tinggi bagian padat (Hs)', [frac('Wk','Gs × A'), frac(fmt(k.Wk, 2), `${fmt(k.gs, 3)} × ${fmt(k.A, 2)}`), `<b>${fmt(k.Hs, 3)} cm</b>`])}</div>
          <div class="calc-step">${eqLines('Angka pori awal (e₀)', [frac('Ho − Hs','Hs'), frac(`${fmt(k.ho, 2)} − ${fmt(k.Hs, 3)}`, fmt(k.Hs, 3)), `<b>${fmt(k.e0, 3)}</b>`])}</div>
          <div class="calc-step">${eqLines('Derajat kejenuhan (Sr)', [frac('w₀ × Gs','e₀'), frac(`${fmt(k.w0, 2)} × ${fmt(k.gs, 3)}`, fmt(k.e0, 3)), `<b>${fmt(k.S, 2)}%</b>`])}</div>
        </div>
        <div class="calc-sec font-bold">2. Uji konsolidasi (Contoh Beban 1 kg, p = ${fmt(st2.p, 3)} kg/cm²)</div>
        <div class="calc-indent1">
          ${eqLines('a. Perubahan tebal (ΔH)', [frac('bacaan akhir − awal','1000'), `<b>${fmt(st2.dh, 4)} cm</b>`])}
          <div class="calc-step">${eqLines('b. Perubahan angka pori (Δe)', [frac('ΔH','Hs'), frac(fmt(st2.dh, 4), fmt(k.Hs, 3)), `<b>${fmt(st2.de, 4)}</b>`])}</div>
          <div class="calc-step">${eqLines('c. Angka pori (e)', ['e₁ − Δe', `${fmt(k.stages[1].e, 3)} − ${fmt(st2.de, 4)}`, `<b>${fmt(st2.e, 3)}</b>`])}</div>
          <div class="calc-step">${eqLines('d. Indeks kompresi (Cc)', [frac('e₁ − e₂','log(p₂/p₁)'), `<b>${fmt(st2.cc, 4)}</b>`])}</div>
          <div class="calc-step">${eqLines('e. Tebal akhir (h)', ['h₁ − Δh', `${fmt(k.stages[1].h, 4)} − ${fmt(st2.dh, 4)}`, `<b>${fmt(st2.h, 4)} cm</b>`])}</div>
          <div class="calc-step">${eqLines('f. Tebal rata-rata (d)', [frac('h₁ + h₂','2'), frac(`${fmt(k.stages[1].h, 4)} + ${fmt(st2.h, 4)}`,'2'), `<b>${fmt(st2.dAvg, 4)} cm</b>`])}</div>
          <div class="calc-step">${eqLines('g. t₉₀', ['(√t₉₀)²', `(${fmt(st2.sqrtT90, 4)})²`, `<b>${fmt(st2.t90Min, 3)} menit</b> (${fmt(st2.t90Sec, 1)} detik)`])}</div>
          <div class="calc-step">${eqLines('h. Koefisien konsolidasi (Cv)', [frac('0,848 × (d/2)²','t₉₀ (detik)'), `<b>${fmtExp(st2.cv)} cm²/detik</b>`])}</div>
        </div>
      `);
    }

    case 'ucs': {
      const r = R.ucs.rows[6]; // t = 5 mnt (puncak)
      return wrap(`
        ${calcHead('3.8.5', 'Pengolahan Data', 'Berikut perhitungan yang dilakukan pada pengolahan data uji kuat tekan bebas:')}
        <div class="font-bold">Diketahui (t = ${fmt(r.t, 1)} menit, puncak):</div>
        <div class="calc-indent1">
          ${eqPairs([
            ['Diameter contoh (D)', `${fmt(R.ucs.D, 2)} cm`],
            ['Tinggi contoh (H)', `${fmt(R.ucs.H, 1)} cm`],
            ['Luas perawal (A₀)', `${fmt(R.ucs.A0, 3)} cm²`],
            ['Dial reading beban', `${fmt(r.loadDiv, 2)}`],
            ['Regangan (ε)', `${fmt(r.eps, 5)}`],
            ['Kalibrasi proving ring', '0,0045']
          ])}
        </div>
        <div class="calc-sec font-bold">a. Menghitung beban (P)</div>
        <div class="calc-indent1">${eqLines('Beban', ['Dial reading × Kalibrasi proving ring × 101,972', `${fmt(r.loadDiv, 2)} × 0,0045 × 101,972`, `<b>${fmt(r.loadKg, 4)} kg</b>`])}</div>
        <div class="calc-sec font-bold">b. Menghitung luas terkoreksi (A')</div>
        <div class="calc-indent1">${eqLines("Luas terkoreksi (A')", [frac('A₀','1 − ε'), frac(fmt(R.ucs.A0, 3), `1 − ${fmt(r.eps, 5)}`), `<b>${fmt(r.aKor, 3)} cm²</b>`])}</div>
        <div class="calc-sec font-bold">c. Menghitung tegangan (σ / qu) dan kohesi (cu)</div>
        <div class="calc-indent1">
          ${eqLines('Tegangan (qu)', [frac('Beban',"Luas terkoreksi (A')"), frac(fmt(r.loadKg, 4), fmt(r.aKor, 3)), `<b>${fmt(R.ucs.qu, 4)} kg/cm²</b>`])}
          <div class="calc-step">${eqLines('Kohesi tak teralir (cu)', [frac('qu','2'), frac(fmt(R.ucs.qu, 4),'2'), `<b>${fmt(R.ucs.cu, 4)} kg/cm²</b>`])}</div>
        </div>
      `);
    }

    case 'directshear': {
      const ds = R.directShear;
      const dMax1 = Math.max(...ds.rows.map(row => row[0].dial || 0)); const gayaMax1 = dMax1 * ds.cal;
      return wrap(`
        ${calcHead('3.9.5', 'Pengolahan Data', 'Berikut contoh pengolahan data kuat geser langsung pada praktikum mekanika tanah sebagai berikut:')}
        <div class="font-bold">Diketahui :</div>
        <div class="calc-indent1">
          ${eqPairs([
            ['Diameter contoh', '6,31 cm'],
            ['Tinggi contoh', '2 cm']
          ])}
          ${eqLines('Luas (A)', ['π × r²', '3,14 × 3,155²', `<b>${fmt(ds.luas, 3)} cm²</b>`])}
        </div>
        <div class="calc-sec font-bold">a) Menghitung tegangan normal (σ)</div>
        <div class="calc-indent1">${eqLines('σ₁', [frac('Gaya normal','Luas'), frac(fmt(ds.pNormal[0], 3), fmt(ds.luas, 3)), `<b>${fmt(ds.sigma[0], 3)} kg/cm²</b>`])}</div>
        <div class="calc-sec font-bold">b) Menghitung gaya geser (P)</div>
        <div class="calc-indent1">${eqLines('P₁', ['Dial reading × kalibrasi proving ring', `${fmt(dMax1, 2)} × 0,540`, `<b>${fmt(gayaMax1, 3)} kg</b>`])}</div>
        <div class="calc-sec font-bold">c) Menghitung tekanan geser (τ)</div>
        <div class="calc-indent1">${eqLines('τ₁', [frac('P','Luas'), frac(fmt(gayaMax1, 3), fmt(ds.luas, 3)), `<b>${fmt(ds.tauMax[0], 4)} kg/cm²</b>`])}</div>
        <div class="calc-sec">
          ${eqPairs([
            ['Kohesi (c)', `<b>${fmt(ds.c, 3)} kg/cm²</b>`],
            ['Sudut geser dalam (φ)', `<b>${fmt(ds.phi, 2)}°</b>`]
          ])}
        </div>
      `);
    }

    case 'permeabilitas': {
      const p = R.permeabilitas;
      return wrap(`
        ${calcHead('3.11.5', 'Pengolahan Data', 'Beberapa contoh perhitungan yang dilakukan pada uji permeabilitas:')}
        <div class="calc-indent1">${eqPairs([['Tinggi benda uji (L)', '6 cm'], ['Beda tinggi muka air (h)', '70 cm']])}</div>
        <div class="calc-sec font-bold">1. Luas (A)</div>
        <div class="calc-indent1">${eqLines('A', [`${frac('1','4')} × 3,14 × D²`, `${frac('1','4')} × 3,14 × 6,35²`, `${frac('1','4')} × 3,14 × 40,3225`, `<b>${fmt(p.A, 4)} cm²</b>`])}</div>
        <div class="calc-sec font-bold">2. Menghitung Debit Air (Q = V / t)</div>
        <div class="calc-indent1">
          ${p.trials.map((tr, i) => `
            <div class="calc-step">${eqLines(`${['a','b','c'][i]}. Q${i+1}`, [frac(fmt(tr.V, 2), String(p.t)), `<b>${fmt(tr.Q, 4)} cm³/detik</b>`])}</div>
          `).join('')}
        </div>
        <div class="calc-sec font-bold">3. Menghitung Koefisien Permeabilitas (k = (Q × L) / (A × h))</div>
        <div class="calc-indent1">
          ${p.trials.map((tr, i) => `
            <div class="calc-step">${eqLines(`${['a','b','c'][i]}. k${i+1}`, [frac(`${fmt(tr.Q, 4)} × 6`, `${fmt(p.A, 4)} × 70`), frac(fmt(tr.Q * 6, 3), fmt(p.A * 70, 3)), `<b>${fmt(tr.k, 6)} cm/detik</b>`])}</div>
          `).join('')}
          <div class="calc-sec">${eqPairs([['Koefisien Permeabilitas Rata-rata (k)', `<b>${fmt(p.kAvg, 6)} cm/detik</b>`]])}</div>
        </div>
      `);
    }
    default: return '';
  }
}

function kopLabHTML(title, sni, sampleText = '') {
  const who = `${state.activeMemberName} (NIM ${state.nimRaw || '0'} • Δ=${fmt(state.delta, 2)})`;
  return `
    <div class="border border-slate-400 rounded-t-lg overflow-hidden mb-0">
      <div class="bg-white p-3 border-b border-slate-300 text-center">
        <div class="text-xs font-extrabold tracking-wide text-slate-900">KELOMPOK BIDANG KEAHLIAN GEOTEKNIK</div>
        <div class="text-xs font-bold text-slate-800">PROGRAM STUDI TEKNIK SIPIL</div>
        <div class="text-[11px] font-semibold text-slate-600">FAKULTAS SAINS DAN TEKNOLOGI – UNIVERSITAS JAMBI</div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-1 px-3 py-2 text-[11px] bg-slate-50 border-b border-slate-300">
        <div><b>Proyek :</b> Praktikum Mekanika Tanah 2026 ${sampleText ? `• <b>Sampel:</b> ${sampleText}` : ''}</div>
        <div><b>Dikerjakan :</b> ${who}</div>
      </div>
      <div class="lab-banner text-xs">
        <div>${title}</div>
        <div class="text-[11px] font-semibold text-slate-700">${sni}</div>
      </div>
    </div>
  `;
}

function buildFormHTML(tabId, R) {
  switch (tabId) {
    case 'sondir':
      return `
        ${kopLabHTML('UJI PENETRASI KONUS', 'SNI 2827 - 2008')}
        <div class="overflow-x-auto">
          <table class="lab-table">
            <thead>
              <tr><th>MT (m)</th><th>PK (kg/cm²)*</th><th>JP (kg/cm²)*</th><th>HL = JP−PK</th><th>HL×20/10</th><th>JHL (kg/cm)</th><th>HS = HL/10</th></tr>
            </thead>
            <tbody>
              ${R.sondir.rows.map(r => `

    case 'directshear': {

        <div class="overflow-x-auto">
          <table class="lab-table">
            <thead>
              <tr>
                <th rowspan="2">No</th>
                <th colspan="3">BU 1 (P=${fmt(ds.pNormal[0],3)} kg • σ=${fmt(ds.sigma[0],3)})</th>
                <th colspan="3">BU 2 (P=${fmt(ds.pNormal[1],3)} kg • σ=${fmt(ds.sigma[1],3)})</th>
                <th colspan="3">BU 3 (P=${fmt(ds.pNormal[2],3)} kg • σ=${fmt(ds.sigma[2],3)})</th>
              </tr>
              <tr><th>Dial*</th><th>P (kg)</th><th>τ (kg/cm²)</th><th>Dial*</th><th>P (kg)</th><th>τ (kg/cm²)</th><th>Dial*</th><th>P (kg)</th><th>τ (kg/cm²)</th></tr>
            </thead>
            <tbody>
              ${ds.rows.map((row, idx) => `
                <tr class="text-right">
                  <td class="text-center">${idx+1}</td>
                  ${row.map(c => c ? `<td class="nim-cell">${fmt(c.dial,2)}</td><td>${fmt(c.P,3)}</td><td class="font-semibold">${fmt(c.tau,4)}</td>` : '<td></td><td></td><td></td>').join('')}
                </tr>
              `).join('')}
              <tr class="bg-emerald-50 font-bold text-right">
                <td class="text-center">τ maks</td>
                <td colspan="3">${fmt(ds.tauMax[0],4)}</td>

    case 'permeabilitas': {
      const p = R.permeabilitas;
      return `
        ${kopLabHTML('PEMERIKSAAN PERMEABILITAS — CONSTANT HEAD TEST', 'ASTM D2434 (h = 70 cm sesuai PDF Kelompok 7)')}
        <div class="overflow-x-auto">
          <table class="lab-table">
            <thead><tr><th>Uraian</th><th>Simbol</th><th>Satuan</th><th>Percobaan 1</th><th>Percobaan 2</th><th>Percobaan 3</th></tr></thead>
            <tbody>
              <tr><td>Diameter / Luas Penampang</td><td class="text-center">D / A</td><td class="text-center">cm / cm²</td><td colspan="3" class="text-center">D = ${fmt(p.D,2)} cm &nbsp;|&nbsp; A = ${fmt(p.A,4)} cm² &nbsp;|&nbsp; L = ${fmt(p.L,0)} cm</td></tr>
              <tr><td>Tinggi tekan (sesuai PDF hal. 46)</td><td class="text-center">h</td><td class="text-center">cm</td><td class="text-right">${fmt(p.h,1)}</td><td class="text-right">${fmt(p.h,1)}</td><td class="text-right">${fmt(p.h,1)}</td></tr>
              <tr><td>Volume air tertampung*</td><td class="text-center">V</td><td class="text-center">cm³</td>${p.trials.map(t=>`<td class="text-right nim-cell">${fmt(t.V,2)}</td>`).join('')}</tr>
              <tr><td>Waktu penampungan</td><td class="text-center">t</td><td class="text-center">detik</td>${p.trials.map(()=>`<td class="text-right">${p.t}</td>`).join('')}</tr>
              <tr><td>Debit aliran (V/t)</td><td class="text-center">Q</td><td class="text-center">cm³/detik</td>${p.trials.map(t=>`<td class="text-right">${fmt(t.Q,4)}</td>`).join('')}</tr>

        </div>
      `;
    }
    default: return '';
  }
}

// ============================================================================
// 6. CHART CONFIGS (USED BOTH FOR LIVE UI AND OFFSCREEN EXCEL IMAGE EXPORT)
// ============================================================================
function getChartSpecsForTab(tabId, R) {
  const baseOpts = (title, xLabel, yLabel, extra = {}) => ({
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    plugins: {
      legend: { position: 'top', labels: { font: { size: 11 }, usePointStyle: true } },
      title: { display: true, text: title, font: { size: 13, weight: 'bold' }, color: '#0f172a' }
    },
    scales: {
      x: { title: { display: true, text: xLabel, font: { weight: 'bold' } }, grid: { color: '#e2e8f0' }, ...(extra.x || {}) },
      y: { title: { display: true, text: yLabel, font: { weight: 'bold' } }, grid: { color: '#e2e8f0' }, ...(extra.y || {}) }
    }
  });

  switch (tabId) {
    case 'sondir':
      return [
        {
          id: 'chart_sondir_pk', title: 'Grafik Perlawanan Konus (PK) vs Kedalaman',
          config: {
            type: 'scatter',
            data: { datasets: [{ label: 'PK (kg/cm²)', data: R.sondir.rows.map(r => ({ x: r.pk, y: r.mt })), showLine: true, borderColor: '#b91c1c', backgroundColor: '#b91c1c', pointRadius: 3, tension: 0 }] },
            options: baseOpts(`Sondir — Perlawanan Konus (PK) [Δ=${fmt(R.delta,2)}]`, 'PK (kg/cm²)', 'Kedalaman (m)', { x: { min: 0 }, y: { reverse: true, min: 0, max: 11.5 } })
          }
        },
        {
          id: 'chart_sondir_jhl', title: 'Grafik Jumlah Hambatan Lekat (JHL) vs Kedalaman',
          config: {
            type: 'scatter',
            data: { datasets: [{ label: 'JHL (kg/cm)', data: R.sondir.rows.map(r => ({ x: r.jhl, y: r.mt })), showLine: true, borderColor: '#1d4ed8', backgroundColor: '#1d4ed8', pointRadius: 3, tension: 0 }] },
            options: baseOpts(`Sondir — Jumlah Hambatan Lekat (JHL) [Δ=${fmt(R.delta,2)}]`, 'JHL (kg/cm)', 'Kedalaman (m)', { x: { min: 0 }, y: { reverse: true, min: 0, max: 11.5 } })
          }
        }
      ];
    case 'atterberg': {
      const pts = R.atterberg.llRows.map(r => ({ x: r.N, y: r.w }));
      const wMin = 20;
      const linePts = [18, 25, 36].map(n => ({ x: n, y: R.atterberg.llReg.intercept + R.atterberg.llReg.slope * Math.log10(n) }));
      return [{
        id: 'chart_atterberg', title: 'Grafik Batas Cair (Flow Curve) + Garis Bantu N = 25',
        config: {
          type: 'scatter',
          data: {
            datasets: [
              { label: 'Titik Uji (w%)', data: pts, backgroundColor: '#1d4ed8', pointRadius: 5 },
              { label: `Garis Regresi (LL₂₅ = ${fmt(R.atterberg.LL,2)}%)`, data: linePts, showLine: true, borderColor: '#1e3a8a', pointRadius: 0, borderWidth: 2, tension: 0 },
              { label: 'Garis Bantu N = 25 → LL', data: [{ x: 25, y: wMin }, { x: 25, y: R.atterberg.LL }, { x: 0, y: R.atterberg.LL }], showLine: true, borderColor: '#dc2626', borderDash: [6,4], pointRadius: 0, borderWidth: 1.8, tension: 0 },
              { label: 'Titik LL (N=25)', data: [{ x: 25, y: R.atterberg.LL }], backgroundColor: '#dc2626', pointRadius: 6, pointStyle: 'rectRot' }
            ]
          },
          options: baseOpts(`Kurva Aliran Batas Cair [Δ=${fmt(R.delta,2)}]`, 'Jumlah Pukulan (N)', 'Kadar Air w (%)', { x: { min: 0, max: 40 }, y: { min: wMin } })
        }
      }];
    }
    case 'ansar':
      return [{
        id: 'chart_ansar', title: 'Grafik Gradasi Analisa Saringan (Ansar — Skala Log 0,001 → 10 mm)',
        config: {
          type: 'scatter',
          data: { datasets: [{ label: '% Lolos Analisa Saringan', data: R.ansar.rows.filter(r=>r.mm>0 && r.mm<=4.75).map(r=>({x:r.mm, y:r.pctLolos})), showLine: true, borderColor: '#1d4ed8', backgroundColor: '#1d4ed8', pointRadius: 4, tension: 0 }] },
          options: baseOpts(`Grafik Gradasi Butiran — Analisa Saringan [Δ=${fmt(R.delta,2)}]`, 'Diameter Butiran (mm, log 0,001 → 10)', 'Persen Lolos (%)', { x: { type: 'logarithmic', reverse: false, min: 0.001, max: 10 }, y: { min: 0, max: 100 } })
        }
      }];
    case 'hidrometer': {
      const comb = [
        ...R.ansar.rows.filter(r=>r.mm>0 && r.mm<=4.75).map(r=>({x:r.mm, y:r.pctLolos})),
        ...R.hidrometer.readings.map(r=>({x:r.Dmm, y:r.Np}))
      ];
      return [{
        id: 'chart_hydro', title: 'Grafik Gradasi Gabungan Saringan + Hidrometer (Anhid)',
        config: {
          type: 'scatter',
          data: {
            datasets: [
              { label: 'Kurva Gradasi Gabungan (Saringan + Hidrometer)', data: comb, showLine: true, borderColor: '#1d4ed8', backgroundColor: '#1d4ed8', pointRadius: 3.5, tension: 0 }
            ]
          },
          options: baseOpts(`Grafik Gradasi Gabungan Saringan & Hidrometer [Δ=${fmt(R.delta,2)}]`, 'Diameter Butiran (mm, log 0,001 → 10)', 'Persen Lolos (%)', { x: { type: 'logarithmic', reverse: false, min: 0.001, max: 10 }, y: { min: 0, max: 100 } })
        }
      }];
    }
    case 'pemadatan':
      return [{
        id: 'chart_comp', title: 'Grafik Pemadatan (γd & ZAV vs Kadar Air) + Garis Bantu w_opt',
        config: {
          type: 'scatter',
          data: {
            datasets: [
              { label: 'Kepadatan Kering (γd)', data: R.pemadatan.rows.map(r=>({x:r.w, y:r.gammaD})), showLine: true, borderColor: '#1d4ed8', backgroundColor: '#1d4ed8', pointRadius: 5, tension: 0 },
              { label: 'Zero Air Void (ZAV)', data: R.pemadatan.rows.map(r=>({x:r.w, y:r.zav})), showLine: true, borderColor: '#0f172a', backgroundColor: '#0f172a', pointRadius: 3.5, tension: 0 },
              { label: `Garis Bantu (w_opt=${fmt(R.pemadatan.wOpt,2)}%, γd=${fmt(R.pemadatan.gdMax,3)})`, data: [{x:R.pemadatan.wOpt, y:1.0}, {x:R.pemadatan.wOpt, y:R.pemadatan.gdMax}, {x:0, y:R.pemadatan.gdMax}], showLine: true, borderColor: '#dc2626', borderDash: [6,4], pointRadius: 0, borderWidth: 1.8, tension: 0 }
            ]
          },
          options: baseOpts(`Grafik Pemadatan Ringan [w_opt=${fmt(R.pemadatan.wOpt,2)}%, γd_maks=${fmt(R.pemadatan.gdMax,3)}]`, 'Kadar Air w (%)', 'Kepadatan Kering γd (gr/cm³)', { x: { min: 0, max: 20 }, y: { min: 1.0, max: 2.2 } })
        }
      }];
    case 'cbr':
      return R.cbr.sets.map((s, idx) => {
        const col = ['#1d4ed8', '#059669', '#b91c1c'][idx];
        return {
          id: `chart_cbr_${s.id}`, title: `Grafik Beban–Penurunan CBR ${s.label}`,
          config: {
            type: 'scatter',
            data: {
              datasets: [
                { label: `Beban ${s.label} (CBR 2,54=${fmt(s.cbr254,2)}%)`, data: R.cbr.penurunan.map((p,i)=>({x:p, y:s.beban[i]})), showLine: true, borderColor: col, backgroundColor: col, pointRadius: 3.5, tension: 0 }
              ]
            },
            options: baseOpts(`CBR ${s.label} — Beban vs Penurunan [Δ=${fmt(R.delta,2)}]`, 'Penurunan (mm)', 'Beban Penetrasi (kN)', { x: { min: 0, max: 14 }, y: { min: 0 } })
          }
        };
      });
    case 'konsolidasi': {
      const k = R.konsolidasi;
      const loadPts = k.stages.slice(1, 4).map(s => ({ x: s.p, y: s.e }));
      const unloadPts = k.stages.slice(3).map(s => ({ x: s.p, y: s.e }));
      const tCharts = k.taylor.map((t, idx) => {
        const xMax = idx < 2 ? 3 : 8;
        const ptsVis = t.sqt.map((x,i)=>({x, y:t.Rs[i]})).filter(p => p.x <= xMax + 0.05);
        const rMin = idx === 0 ? 0 : Math.floor((t.Rs[0] - 5) / 5) * 5;
        const rMax = Math.ceil((Math.max(...ptsVis.map(p=>p.y)) + 4) / 5) * 5;
        const sqt90 = Math.sqrt(t.t90);
        // Garis lurus awal & garis 1.15x dalam rentang terlihat
        const xEndInit = Math.min(xMax, idx === 0 ? 1.0 : idx === 1 ? 1.5 : 6.2);
        const y0 = t.lineInit ? t.lineInit[0] : t.Rs[0];
        const slopeInit = t.lineInit && t.sqt[2] > 0 ? (t.lineInit[2] - y0) / t.sqt[2] : 0;
        const initPts = [{ x: 0, y: y0 }, { x: xEndInit, y: y0 + slopeInit * xEndInit }];
        const l115Pts = [{ x: 0, y: y0 }, { x: Math.min(xMax, xEndInit * 1.15), y: y0 + (slopeInit / 1.15) * Math.min(xMax, xEndInit * 1.15) }];
        return {
          id: `chart_kons_t${t.stage}`, title: `Kurva Taylor Beban ${t.bebanKg} kg (√t: 0–${xMax} + Garis Vertikal √t₉₀)`,
          config: {
            type: 'scatter',
            data: {
              datasets: [
                { label: `Data R (${t.bebanKg} kg)`, data: ptsVis, showLine: true, borderColor: ['#1d4ed8','#059669','#b91c1c'][idx], backgroundColor: ['#1d4ed8','#059669','#b91c1c'][idx], pointRadius: 3.5, tension: 0 },
                { label: 'Garis Lurus Awal', data: initPts, showLine: true, borderColor: '#64748b', borderDash: [5,4], pointRadius: 0, borderWidth: 1.5, tension: 0 },
                { label: 'Garis 1,15×', data: l115Pts, showLine: true, borderColor: '#d97706', borderDash: [5,4], pointRadius: 0, borderWidth: 1.6, tension: 0 },
                { label: `Garis Vertikal √t₉₀ = ${fmt(sqt90,3)}`, data: [{ x: sqt90, y: rMin }, { x: sqt90, y: rMax }], showLine: true, borderColor: '#dc2626', borderDash: [6,4], pointRadius: 0, borderWidth: 1.8, tension: 0 }
              ]
            },
            options: baseOpts(`Taylor Beban ${t.bebanKg} kg (√t₉₀=${fmt(sqt90,3)} • t₉₀=${fmt(t.t90,3)} mnt)`, '√t (√menit)', 'Pembacaan Arloji R (div)', { x: { min: 0, max: xMax }, y: { reverse: true, min: rMin, max: rMax } })
          }
        };
      });
      return [
        {
          id: 'chart_kons_ep', title: 'Grafik Konsolidasi (Angka Pori e vs Tegangan p)',
          config: {
            type: 'scatter',
            data: {
              datasets: [
                { label: 'Pembebanan (Loading)', data: loadPts, showLine: true, borderColor: '#1d4ed8', backgroundColor: '#1d4ed8', pointRadius: 5, tension: 0 },
                { label: 'Pelepasan (Unloading)', data: unloadPts, showLine: true, borderColor: '#dc2626', backgroundColor: '#dc2626', pointRadius: 5, tension: 0 }
              ]
            },
            options: baseOpts(`Kurva Konsolidasi e vs p [Δ=${fmt(R.delta,2)}]`, 'Tegangan p (kg/cm²)', 'Angka Pori (e)', { x: { min: 0, max: 1.1 } })
          }
        },
        ...tCharts
      ];
    }
    case 'ucs': {
      const valid = R.ucs.rows.filter(r=>r.teg!==null);
      return [{
        id: 'chart_ucs', title: 'Grafik Tegangan–Regangan (UCS)',
        config: {
          type: 'scatter',
          data: {
            datasets: [
              { label: `Tegangan σ (qu = ${fmt(R.ucs.qu,4)} kg/cm²)`, data: valid.map(r=>({x:r.eps, y:r.teg})), showLine: true, borderColor: '#1d4ed8', backgroundColor: '#1d4ed8', pointRadius: 4, tension: 0 }
            ]
          },
          options: baseOpts(`UCS — Tegangan vs Regangan [Δ=${fmt(R.delta,2)}]`, 'Regangan (ε)', 'Tegangan (kg/cm²)', { x: { min: 0, max: 0.07 }, y: { min: 0 } })
        }
      }];
    }
    case 'directshear': {
      const ds = R.directShear;
      const xEnd = ds.sigma[ds.sigma.length - 1];
      const line = [0, xEnd].map(x => ({ x, y: ds.c + Math.tan(ds.phi * Math.PI / 180) * x }));
      return [{
        id: 'chart_ds', title: 'Grafik Kuat Geser Langsung (Mohr–Coulomb)',
        config: {
          type: 'scatter',
          data: {
            datasets: [
              { label: 'Titik τ maks', data: ds.sigma.map((s,i)=>({x:s, y:ds.tauMax[i]})), backgroundColor: '#1d4ed8', pointRadius: 6 },
              { label: `Garis Envelope (c=${fmt(ds.c,3)}, φ=${fmt(ds.phi,2)}°)`, data: line, showLine: true, borderColor: '#1e3a8a', pointRadius: 0, borderWidth: 2, tension: 0 },
              { label: `Garis Horizontal (y = c = ${fmt(ds.c,3)})`, data: [{x:0,y:ds.c},{x:xEnd,y:ds.c}], showLine: true, borderColor: '#dc2626', borderDash: [6,4], pointRadius: 0, borderWidth: 1.6, tension: 0 }
            ]
          },
          options: baseOpts(`Direct Shear — τ vs σ [Δ=${fmt(R.delta,2)}]`, 'Tegangan Normal σ (kg/cm²)', 'Tegangan Geser Maksimum τ (kg/cm²)', { x: { min: 0, max: 0.5 }, y: { min: 0 } })
        }
      }];
    }
    default: return [];
  }
}

  ];
  const passCount = checks.filter(c => c.ok).length;

  const compRows = [

function destroyCharts() {
  activeCharts.forEach(c => { try { c.destroy(); } catch (e) {} });
  activeCharts = [];
}

function closeMobileMenu() {
  const m = document.getElementById('mobileMenuModal');
  if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
}
function openMobileMenu() {
  const m = document.getElementById('mobileMenuModal');
  if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
}
function renderSidebar() {
  const nav = document.getElementById('tabList');
  nav.innerHTML = TABS.map(t => {
    const active = t.id === state.activeTab;
    return `
      <button type="button" data-tab="${t.id}" class="tab-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-left text-xs transition ${active ? 'bg-slate-900 text-white font-bold shadow-sm' : 'text-slate-700 hover:bg-slate-100 font-medium'}">
        <span class="truncate">${t.label}</span>
        <span class="ml-2 px-1.5 py-0.5 rounded text-[10px] shrink-0 ${active ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-500'}">${t.badge}</span>
      </button>
    `;
  }).join('');
  nav.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab;
      renderAll();
    });
  });

  const mGrid = document.getElementById('mobileTabGrid');
  if (mGrid) {
    mGrid.innerHTML = TABS.map(t => {
      const active = t.id === state.activeTab;
      return `
        <button type="button" data-tab="${t.id}" class="mob-tab-btn flex flex-col items-start justify-between p-2.5 rounded-xl border text-left transition ${active ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50'}">
          <span class="text-xs font-bold leading-snug">${t.label}</span>
          <span class="mt-1 px-1.5 py-0.5 rounded text-[10px] ${active ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-500'}">${t.badge}</span>
        </button>
      `;
    }).join('');
    mGrid.querySelectorAll('.mob-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        closeMobileMenu();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }
}

function renderAll() {
  destroyCharts();
  document.getElementById('deltaBadge').textContent = `+${fmt(state.delta, 2)}`;
  renderSidebar();

  const R0 = computeAll(0, { cbrAddLoadDelta: state.cbrAddLoadDelta });
  const R = computeAll(state.delta, { cbrAddLoadDelta: state.cbrAddLoadDelta });
  const main = document.getElementById('mainContent');

  if (state.activeTab === 'ringkasan') {
    main.innerHTML = buildRingkasanHTML(R0, R);
    return;
  }

  const tabMeta = TABS.find(t => t.id === state.activeTab);
  const chartSpecs = getChartSpecsForTab(state.activeTab, R);

  main.innerHTML = `
    <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">

        <span class="text-[11px] text-slate-500">Mukadimah &amp; urutan persis PDF Kelompok 7</span>

        ${buildCalcHTML(state.activeTab, R)}

    </section>

    <!-- Form Laboratorium -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-5 py-3 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-600">Form Laboratorium UNJA (Siap Export Excel)</span>
        <span class="text-[11px] text-blue-700 font-semibold">* Sel biru = nilai dasar + ${fmt(state.delta, 2)}</span>
      </div>
      <div class="p-4">
        ${buildFormHTML(state.activeTab, R)}
      </div>
    </section>

    ${chartSpecs.length ? `
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-5 py-3 border-b border-slate-200 bg-slate-50">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-600">Grafik Pengujian (Otomatis Ikut Saat Export Excel)</span>
        </div>
        <div class="p-4 grid grid-cols-1 ${chartSpecs.length > 1 ? 'xl:grid-cols-2' : ''} gap-4">
          ${chartSpecs.map(cs => `
            <div class="border border-slate-200 rounded-xl p-3 bg-white">
              <div class="relative h-72"><canvas id="${cs.id}"></canvas></div>
            </div>
          `).join('')}
        </div>
      </section>
    ` : ''}
  `;

  // Wire buttons
  const btnCopy = document.getElementById('btnCopyCalc');
  if (btnCopy) btnCopy.addEventListener('click', () => copyText(document.getElementById('calcPaper').innerText));
  const btnOne = document.getElementById('btnExportOne');
  if (btnOne) btnOne.addEventListener('click', () => exportWorkbook([state.activeTab]));

  // Render Chart.js instances
  chartSpecs.forEach(cs => {
    const canvas = document.getElementById(cs.id);
    if (canvas && typeof Chart !== 'undefined') {
      activeCharts.push(new Chart(canvas.getContext('2d'), cs.config));
    }
  });
}

const TAB_TO_SHEET_IDX = {
  sondir: 0, sandcone: 1, kadarair: 2, beratspec: 4, atterberg: 6,
  ansar: 7, hidrometer: 8, pemadatan: 9, cbr: 10, konsolidasi: 13,
  ucs: 16, directshear: 17, permeabilitas: 18, ringkasan: 0
};

function xmlSetNum(xml, ref, val) {
  const re = new RegExp(`(<c\\b[^>]*\\br="${ref}"[^>]*?)(?:/>|>.*?</c>)`, 's');
  return xml.replace(re, (_, openTag) => {
    const cleanOpen = openTag.replace(/\s+t="[^"]*"/g, '');
    return `${cleanOpen}><v>${Number(val)}</v></c>`;
  });
}

function xmlStripFormulaCaches(xml) {
  // Strip cached <v>...</v> inside formula cells so Excel recalculates & redraws native charts on open
  return xml.replace(/(<c\b[^>]*>\s*<f\b[^>]*>[\s\S]*?<\/f>)\s*<v>[\s\S]*?<\/v>(\s*<\/c>)/g, '$1$2');
}

async function buildPatchedXlsxBuffer(R, activeTabId) {
  const zip = await JSZip.loadAsync(TEMPLATE_K7_B64, { base64: true });

  const patchSheet = async (path, fn) => {
    let xml = await zip.file(path).async('string');
    xml = fn(xml);
    xml = xmlStripFormulaCaches(xml);
    zip.file(path, xml);
  };

  // 1. Sondir (sheet38)
  await patchSheet('xl/worksheets/sheet38.xml', xml => {
    R.sondir.rows.forEach((r, i) => {
      const row = 19 + i;
      xml = xmlSetNum(xml, `B${row}`, +r.pk.toFixed(4));
      xml = xmlSetNum(xml, `C${row}`, +r.jp.toFixed(4));
    });
    return xml;
  });

  // 2. Kadar Air TT (sheet24) & TG (sheet25)
  const kaCols = ['H', 'I', 'J'];
  await patchSheet('xl/worksheets/sheet24.xml', xml => {
    R.kadarAir.tt.rows.forEach((r, i) => {
      xml = xmlSetNum(xml, `${kaCols[i]}17`, +r.w1.toFixed(4));
      xml = xmlSetNum(xml, `${kaCols[i]}18`, +r.w2.toFixed(4));
    });
    return xml;
  });
  await patchSheet('xl/worksheets/sheet25.xml', xml => {
    R.kadarAir.tg.rows.forEach((r, i) => {
      xml = xmlSetNum(xml, `${kaCols[i]}17`, +r.w1.toFixed(4));
      xml = xmlSetNum(xml, `${kaCols[i]}18`, +r.w2.toFixed(4));
    });
    return xml;
  });

  // 3. Berat Spesifik TT Pikno A (sheet26) & TG Pikno B (sheet27)
  await patchSheet('xl/worksheets/sheet26.xml', xml => {
    xml = xmlSetNum(xml, 'G18', +R.beratSpesifik.a.w2.toFixed(4));
    xml = xmlSetNum(xml, 'G20', +R.beratSpesifik.a.w3.toFixed(4));
    return xml;
  });
  await patchSheet('xl/worksheets/sheet27.xml', xml => {
    xml = xmlSetNum(xml, 'G18', +R.beratSpesifik.b.w2.toFixed(4));
    xml = xmlSetNum(xml, 'G20', +R.beratSpesifik.b.w3.toFixed(4));
    return xml;
  });

  // 4. Atterberg (sheet28)
  const attCols = ['E', 'F', 'G', 'H', 'I', 'J'];
  const attAll = [...R.atterberg.llRows, ...R.atterberg.plRows];
  await patchSheet('xl/worksheets/sheet28.xml', xml => {
    attAll.forEach((r, i) => {
      xml = xmlSetNum(xml, `${attCols[i]}16`, +r.w1.toFixed(4));
      xml = xmlSetNum(xml, `${attCols[i]}17`, +r.w2.toFixed(4));
    });
    return xml;
  });

  // 5. Analisis Saringan (sheet29)
  await patchSheet('xl/worksheets/sheet29.xml', xml => {
    R.ansar.rows.forEach((r, i) => {
      if (r.addNim) xml = xmlSetNum(xml, `C${17 + i}`, +r.w.toFixed(4));
    });
    return xml;
  });

  // 6. Hidrometer (sheet30) — k=-0.50 & L=16.3-0.16*Rh already baked into template
  await patchSheet('xl/worksheets/sheet30.xml', xml => {
    xml = xmlSetNum(xml, 'H10', +R.hidrometer.c.toFixed(4));
    R.hidrometer.sieves.forEach((s, i) => {
      xml = xmlSetNum(xml, `C${13 + i}`, +s.w.toFixed(4));
    });
    R.hidrometer.readings.forEach((r, i) => {
      xml = xmlSetNum(xml, `B${22 + i}`, +r.rh.toFixed(4));
    });
    return xml;
  });

  // 7. Pemadatan (sheet32)
  const compCols = ['E', 'F', 'G', 'H', 'I'];
  await patchSheet('xl/worksheets/sheet32.xml', xml => {
    R.pemadatan.rows.forEach((r, i) => {
      xml = xmlSetNum(xml, `${compCols[i]}20`, +r.basahCawan.toFixed(4));
      xml = xmlSetNum(xml, `${compCols[i]}21`, +r.keringCawan.toFixed(4));
    });
    return xml;
  });

  // 8. CBR 3x10 (sheet33), 3x30 (sheet34), 3x65 (sheet35) — termasuk t=0 (C23)!
  const cbrSheets = ['xl/worksheets/sheet33.xml', 'xl/worksheets/sheet34.xml', 'xl/worksheets/sheet35.xml'];
  for (let sIdx = 0; sIdx < 3; sIdx++) {
    const s = R.cbr.sets[sIdx];
    await patchSheet(cbrSheets[sIdx], xml => {
      xml = xmlSetNum(xml, 'K16', +s.tcSeb.toFixed(4));
      xml = xmlSetNum(xml, 'L16', +s.tcSes.toFixed(4));
      xml = xmlSetNum(xml, 'E47', +s.kaSeb.basah.toFixed(4));
      xml = xmlSetNum(xml, 'F47', +s.kaSes.basah.toFixed(4));
      xml = xmlSetNum(xml, 'E48', +s.kaSeb.kering.toFixed(4));
      xml = xmlSetNum(xml, 'F48', +s.kaSes.kering.toFixed(4));
      s.beban.forEach((b, i) => {
        xml = xmlSetNum(xml, `C${23 + i}`, +b.toFixed(4));
      });
      return xml;
    });
  }

  // 9. Konsolidasi R1 (sheet13 arloji + strip caches on sheet12, 14, 15, 16)
  const kCols = ['C', 'D', 'E', 'F', 'G'];
  await patchSheet('xl/worksheets/sheet13.xml', xml => {
    R.konsolidasi.arloji.forEach((row, rIdx) => {
      row.forEach((v, cIdx) => {
        xml = xmlSetNum(xml, `${kCols[cIdx]}${30 + rIdx}`, +v.toFixed(4));
      });
    });
    return xml;
  });
  await patchSheet('xl/worksheets/sheet12.xml', xml => xml);
  await patchSheet('xl/worksheets/sheet15.xml', xml => {
    const t90Cells = ['I16', 'I18', 'I20'];
    R.konsolidasi.taylor.forEach((t, idx) => {
      if (t && Number.isFinite(t.t90)) xml = xmlSetNum(xml, t90Cells[idx], +t.t90.toFixed(6));
    });
    return xml;
  });

  // 10. UCS (sheet40)
  await patchSheet('xl/worksheets/sheet40.xml', xml => {
    R.ucs.rows.forEach((r, i) => {
      if (i > 0 && r.loadDiv !== null) xml = xmlSetNum(xml, `D${16 + i}`, +r.loadDiv.toFixed(4));
    });
    return xml;
  });

  // 11. Direct Shear (sheet41)
  const dsCols = ['C', 'F', 'I'];
  await patchSheet('xl/worksheets/sheet41.xml', xml => {
    R.directShear.rows.forEach((row, rIdx) => {
      row.forEach((cell, cIdx) => {
        if (cell !== null) xml = xmlSetNum(xml, `${dsCols[cIdx]}${16 + rIdx}`, +cell.dial.toFixed(4));
      });
    });
    return xml;
  });

  // 12. Permeabilitas Constant Head (sheet31) — h=70 cm already in template
  const permCols = ['H', 'I', 'J'];
  await patchSheet('xl/worksheets/sheet31.xml', xml => {
    R.permeabilitas.trials.forEach((tr, i) => {
      xml = xmlSetNum(xml, `${permCols[i]}28`, +tr.V.toFixed(4));
    });
    return xml;
  });

  // Strip formula caches on R2 KUNCI (sheet37) & REFERENSI (sheet42) & SONDIR GRAFIK (sheet39)
  for (const p of ['xl/worksheets/sheet51.xml', 'xl/worksheets/sheet52.xml', 'xl/worksheets/sheet53.xml', 'xl/worksheets/sheet54.xml', 'xl/worksheets/sheet55.xml', 'xl/worksheets/sheet56.xml', 'xl/worksheets/sheet57.xml', 'xl/worksheets/sheet58.xml', 'xl/worksheets/sheet59.xml']) {
    await patchSheet(p, xml => xml);
  }

  // Set active sheet tab in xl/workbook.xml if exporting a specific test
  if (activeTabId && TAB_TO_SHEET_IDX[activeTabId] !== undefined) {
    let wbXml = await zip.file('xl/workbook.xml').async('string');
    wbXml = wbXml.replace(/activeTab="\d+"/, `activeTab="${TAB_TO_SHEET_IDX[activeTabId]}"`);
    zip.file('xl/workbook.xml', wbXml);
  }

  // Strip stale numCache on native charts so Excel plots fresh recalculated NIM points cleanly
  for (const fn of Object.keys(zip.files)) {
    if (fn.startsWith('xl/charts/chart') && fn.endsWith('.xml')) {
      let cxml = await zip.file(fn).async('string');
      cxml = cxml.replace(/<c:numCache>[\s\S]*?<\/c:numCache>/g, '');
      zip.file(fn, cxml);
    }
  }

  return await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
}

async function exportWorkbook(tabIds) {
  if (typeof JSZip === 'undefined') {
    showToast('Library JSZip belum termuat. Periksa koneksi internet.');
    return;
  }
  showToast('Menyiapkan file Excel (.xlsx) format form UNJA & grafik asli...');
  try {
    const R = computeAll(state.delta, { cbrAddLoadDelta: state.cbrAddLoadDelta });
    const singleId = tabIds.length === 1 ? tabIds[0] : null;
    const bytes = await buildPatchedXlsxBuffer(R, singleId);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const suffix = singleId ? singleId.toUpperCase() : 'FORM_LENGKAP_UNJA';
    a.download = `Kelompok7_NIM_${state.nimRaw || '0'}_${suffix}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2500);
    showToast('File Excel (.xlsx) berlogo UNJA & grafik interaktif berhasil diunduh!');
  } catch (err) {
    console.error(err);
    showToast('Gagal membuat file Excel: ' + (err && err.message ? err.message : 'kesalahan tak terduga'));
  }
}
